      if (hrs < 24) return hrs + " hour" + (hrs > 1 ? "s" : "") + " ago";

      if (tab === "home") this.loadAndRenderHome();

    onCardClick(id, event) {
      if (event.metaKey || event.ctrlKey || event.shiftKey || event.button === 1) {

    /* PREVIEW ENGINE (Desktop Cursor Move & Scroll Intersection) */
    parseDurationToSeconds(str) {
      if (!str || str === "—") return 600;
      try {
        const parts = String(str).trim().split(":").map(Number);
        if (parts.length === 3 && !parts.some(isNaN)) return parts[0] * 3600 + parts[1] * 60 + parts[2];
        if (parts.length === 2 && !parts.some(isNaN)) return parts[0] * 60 + parts[1];
        const n = parseInt(str);
        if (!isNaN(n)) return n * 60;
      } catch (_) {}
      return 600;
    }

    formatPreviewTime(sec) {
      sec = Math.max(0, Math.floor(sec || 0));
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return m + ":" + (s < 10 ? "0" : "") + s;
    }

    onCardHover(card, e) {
      if (!card) return;
      card._hoverActive = true;
      clearTimeout(card._hoverTimer);
      card._hoverTimer = setTimeout(() => {
        if (card._hoverActive) {
          this.startCardPreview(card, "hover");
        }
      }, 140);
    }

    onCardMove(card, e) {
      if (!card) return;
      card._hoverActive = true;
      const wrap = card.querySelector(".thumb-wrap");
      if (!wrap) return;
      const rect = wrap.getBoundingClientRect();
      const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));

      if (!card.classList.contains("preview-active")) {
        this.startCardPreview(card, "hover");
      }

      const fill = card.querySelector(".preview-scrub-fill");
      if (fill) fill.style.width = (pct * 100) + "%";

      const bubble = card.querySelector(".preview-time-bubble");
      const totalSec = this.parseDurationToSeconds(card.dataset.duration);
      const curSec = Math.floor(pct * totalSec);
      if (bubble) {
        bubble.style.display = "block";
        bubble.style.left = (pct * 100) + "%";
        bubble.textContent = this.formatPreviewTime(curSec) + " / " + this.formatPreviewTime(totalSec);
      }

      this.renderFrameCanvas(card, pct);

      if (!card._embedLoaded) {
        clearTimeout(card._embedTimer);
        card._embedTimer = setTimeout(() => {
          if (card._hoverActive && card.dataset.embed) {
            this.mountPreviewEmbed(card);
          }
        }, 360);
      }
    }

    onCardLeave(card, e) {
      if (!card) return;
      card._hoverActive = false;
      clearTimeout(card._hoverTimer);
      clearTimeout(card._embedTimer);
      this.stopCardPreview(card);
    }

    startCardPreview(card, source = "hover") {
      if (source === "hover" && this._activeScrollCard && this._activeScrollCard !== card) {
        this.stopCardPreview(this._activeScrollCard);
        this._activeScrollCard = null;
      }
      card.classList.add("preview-active");

      if (source === "scroll") {
        const fill = card.querySelector(".preview-scrub-fill");
        let start = Date.now();
        const durationMs = 8000;
        cancelAnimationFrame(card._scrollAnim);
        const loopScrub = () => {
          if (!card.classList.contains("preview-active")) return;
          const elapsed = (Date.now() - start) % durationMs;
          const pct = elapsed / durationMs;
          if (fill) fill.style.width = (pct * 100) + "%";
          this.renderFrameCanvas(card, pct);
          card._scrollAnim = requestAnimationFrame(loopScrub);
        };
        card._scrollAnim = requestAnimationFrame(loopScrub);

        clearTimeout(card._scrollEmbedTimer);
        card._scrollEmbedTimer = setTimeout(() => {
          if (card.classList.contains("preview-active") && card.dataset.embed) {
            this.mountPreviewEmbed(card);
          }
        }, 400);
      }
    }

    stopCardPreview(card) {
      if (!card) return;
      card.classList.remove("preview-active");
      cancelAnimationFrame(card._scrollAnim);
      clearTimeout(card._scrollEmbedTimer);
      clearTimeout(card._embedTimer);

      const fill = card.querySelector(".preview-scrub-fill");
      if (fill) fill.style.width = "0%";

      const bubble = card.querySelector(".preview-time-bubble");
      if (bubble) bubble.style.display = "none";

      const canvas = card.querySelector(".preview-canvas");
      if (canvas) canvas.style.display = "none";

      const embedHolder = card.querySelector(".preview-embed-holder");
      if (embedHolder) {
        embedHolder.classList.remove("active");
        embedHolder.innerHTML = "";
      }
      card._embedLoaded = false;
    }

    renderFrameCanvas(card, pct) {
      const canvas = card.querySelector(".preview-canvas");
      const img = card.querySelector(".thumb-wrap img");
      if (!canvas || !img || !img.complete || !img.naturalWidth) return;

      canvas.style.display = "block";
      const w = canvas.width = 320;
      const h = canvas.height = 180;
      const ctx = canvas.getContext("2d");
      if (!ctx) return;

      const zoom = 1.08 + Math.sin(pct * Math.PI) * 0.12;
      const shiftX = (pct - 0.5) * 40;
      const shiftY = Math.sin(pct * Math.PI * 2) * 12;

      ctx.save();
      ctx.translate(w / 2, h / 2);
      ctx.scale(zoom, zoom);
      ctx.translate(-w / 2 + shiftX, -h / 2 + shiftY);
      ctx.drawImage(img, 0, 0, w, h);
      ctx.restore();

      const grad = ctx.createLinearGradient(0, 0, w, 0);
      grad.addColorStop(0, "rgba(0,0,0,0.2)");
      grad.addColorStop(0.5, "rgba(255,255,255,0.04)");
      grad.addColorStop(1, "rgba(0,0,0,0.2)");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);
    }

    mountPreviewEmbed(card) {
      const holder = card.querySelector(".preview-embed-holder");
      if (!holder || holder.querySelector("iframe")) return;
      const embed = card.dataset.embed;
      if (!embed) return;
      const sep = embed.includes("?") ? "&" : "?";
      const previewUrl = this.buildThemedEmbedUrl(embed + sep + "muted=1&autoplay=1&controls=0");
      holder.innerHTML = `<iframe src="${this.esc(previewUrl)}" allow="autoplay; encrypted-media" loading="lazy"></iframe>`;
      holder.classList.add("active");
      card._embedLoaded = true;
    }

    initScrollPreview() {
      if (this._scrollCheckBound) {
        window.removeEventListener("scroll", this._scrollCheckBound);
      }
      this._scrollCheckBound = () => {
        clearTimeout(this._scrollDebounce);
        this._scrollDebounce = setTimeout(() => {
          this.checkScrollPreview();
        }, 220);
      };
      window.addEventListener("scroll", this._scrollCheckBound, { passive: true });
    }

    checkScrollPreview() {
      if (this.tab !== "home" || this.activeVideo || this.selectedCat) {
        this.stopScrollPreview();
        return;
      }
      const cards = document.querySelectorAll("#videosGrid .video-card");
      if (!cards || !cards.length) return;

      const viewportCenter = window.innerHeight / 2;
      let focalCard = null;
      let minDistance = Infinity;

      cards.forEach(card => {
        const rect = card.getBoundingClientRect();
        if (rect.bottom > 80 && rect.top < window.innerHeight - 80) {
          const cardCenter = rect.top + rect.height / 2;
          const dist = Math.abs(cardCenter - viewportCenter);
          if (dist < minDistance && dist < window.innerHeight * 0.35) {
            minDistance = dist;
            focalCard = card;
          }
        }
      });

      if (focalCard && focalCard !== this._activeScrollCard) {
        this.stopScrollPreview();
        this._activeScrollCard = focalCard;
        this.startCardPreview(focalCard, "scroll");
      } else if (!focalCard) {
        this.stopScrollPreview();
      }
    }

    stopScrollPreview() {
      if (this._activeScrollCard) {
        this.stopCardPreview(this._activeScrollCard);
        this._activeScrollCard = null;
      }
    }

    onImgProgress(el) {
      if (!el) return;
      const hi = el.getAttribute("data-hi");
      if (hi && hi !== el.src && !el.dataset.upgraded) {
        el.dataset.upgraded = "1";
        const full = new Image();
        full.decoding = "async";
        full.onload = () => {
          el.src = hi;
          el.classList.remove("lq");
          el.classList.add("loaded");
        };
        full.onerror = () => {
          el.classList.remove("lq");
          el.classList.add("loaded");
        };
        full.src = hi;
      } else {
        requestAnimationFrame(() => {
          el.classList.remove("lq");
          el.classList.add("loaded");
        });
      }
    }

    async loadAndRenderHome(append = false) {
      if (this.loading) return;
      this.loading = true;

      if (!append) {
        this.showLoading(this.query ? "Searching…" : "Loading videos…");
      }

      try {
        let typeId = null;
        let keyword = this.query || null;
        if (this.activeCat && String(this.activeCat).startsWith("kw:")) {
          keyword = keyword || String(this.activeCat).slice(3);
          typeId = null;
        } else if (this.activeCat && this.activeCat !== "all") {
          typeId = this.activeCat;
        }

        let page = this.page;
        const result = await this.fetchVideos({
          page,
          typeId,
          keyword
        });

        if (append) {
          const ids = new Set(this.videos.map(v => v.id));
          result.list.forEach(v => {
            if (!ids.has(v.id)) this.videos.push(v);
          });
        } else {
          // Home All = latest/viral order from API (page 1 first)
          this.videos = result.list;
        }
        this.pagecount = result.pagecount;
        this.total = result.total;
        this.renderHome();
      } catch (e) {
        console.error(e);
        if (!append) this.showError("Could not load videos from API.");
        else this.toast("Failed to load more");
      } finally {
        this.loading = false;
      }
    }

    renderHome() {
      const main = document.getElementById("mainContainer");
      const list = this.videos;
      const title = (this.activeCat && String(this.activeCat).startsWith("kw:"))
        ? String(this.activeCat).slice(3).replace(/\b\w/g, c => c.toUpperCase())
        : (this.query
          ? "Search Results"
          : (this.activeCat === "all"
              ? "Mixed Feed"
              : (this.categories.find(c => String(c.id) === String(this.activeCat))?.name || "Category")));

      let html = `
        <div class="section-head">
          <h2 class="section-title">
            <span>${this.esc(title)}</span>
            <span class="section-count">(${this.total.toLocaleString()})</span>
            ${(this.activeCat !== "all" || this.query) ? `<button class="category-reset-btn" onclick="app.filterCategory('all')">✕ Reset to All</button>` : ""}
          </h2>
          <div style="display:flex;gap:8px;align-items:center;">
            <button class="ctrl-btn shuffle-btn" id="shuffleBtn" onclick="app.shuffleFeed()" title="Refresh feed">
              <span class="icon">
                <svg width="15" height="15" viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
              </span>
              <span>Shuffle</span>
            </button>
            ${this.query ? `<button class="ctrl-btn" onclick="app.clearSearch()">Clear</button>` : ""}
          </div>
        </div>
      `;

      if (!list.length) {
        html += `
          <div class="empty-box">
            <h3>No videos found</h3>
            <p>Try another keyword or category.</p>
            <button class="ctrl-btn solid" onclick="app.clearSearch()">Reset</button>
          </div>
        `;
      } else {
        html += `<div class="videos-grid" id="videosGrid">${list.map((v,i) => this.card(v,i)).join("")}</div>`;
        if (this.page < this.pagecount) {
          html += `<div class="scroll-sentinel" id="scrollSentinel"></div>
            <div class="infinite-status" id="infiniteStatus"></div>`;
        }
      }

      main.innerHTML = html;
      this.bindInfiniteScroll();
      this.initScrollPreview();
      // silent preload next page into memory (no UI)
      if (this.page < this.pagecount && !this._preloading) {
        this._preloading = true;
        const next = this.page + 1;
        const typeId = (this.activeCat && this.activeCat !== "all" && !String(this.activeCat).startsWith("kw:")) ? this.activeCat : null;
        const keyword = this.query || (String(this.activeCat || "").startsWith("kw:") ? String(this.activeCat).slice(3) : null);
        this.fetchVideos({ page: next, typeId, keyword }).then(r => {
          this._prefetch = { page: next, list: r.list, pagecount: r.pagecount };
        }).catch(() => {}).finally(() => { this._preloading = false; });
      }
    }

    bindInfiniteScroll() {
      if (this._io) {
        this._io.disconnect();
        this._io = null;
      }
      const el = document.getElementById("scrollSentinel");
      if (!el) return;
      this._io = new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting) this.loadMoreSilent();
      }, { rootMargin: "400px 0px" });
      this._io.observe(el);
    }

    async loadMoreSilent() {
      if (this.loading || this.page >= this.pagecount) return;
      this.loading = true;
      const st = document.getElementById("infiniteStatus");
      if (st) st.textContent = "Loading…";
      this.page += 1;
      try {
        let typeId = null;
        let keyword = this.query || null;
        if (this.activeCat && String(this.activeCat).startsWith("kw:")) {
          keyword = keyword || String(this.activeCat).slice(3);
        } else if (this.activeCat && this.activeCat !== "all") {
          typeId = this.activeCat;
        }
        if (this.selectedCat) typeId = this.selectedCat.id;

        let result;
        if (this._prefetch && this._prefetch.page === this.page) {
          result = this._prefetch;
          this._prefetch = null;
        } else {
          result = await this.fetchVideos({ page: this.page, typeId, keyword });
        }
        const ids = new Set(this.videos.map(v => v.id));
        const fresh = (result.list || []).filter(v => !ids.has(v.id));
        this.videos.push(...fresh);
        this.pagecount = result.pagecount;

        const grid = document.getElementById("videosGrid");
        if (grid && fresh.length) {
          grid.insertAdjacentHTML("beforeend", fresh.map((v,i) => this.card(v, 99)).join(""));
        }
        if (this.page >= this.pagecount) {
          if (st) st.textContent = "";
          const sen = document.getElementById("scrollSentinel");
          if (sen) sen.remove();
          if (this._io) { this._io.disconnect(); this._io = null; }
        } else if (st) st.textContent = "";
      } catch (e) {
        console.error(e);
        if (st) st.textContent = "Could not load more";
        this.page -= 1;
      } finally {
        this.loading = false;
      }
    }

    async loadMore() {
      await this.loadMoreSilent();
    }

    async shuffleFeed() {
      const btn = document.getElementById("shuffleBtn");
      if (btn) {
        btn.classList.add("spin-anim");

      // Jump to a random page for variety
      const maxPage = Math.min(this.pagecount || 20, 40);
      this.page = Math.floor(Math.random() * maxPage) + 1;
      this.videos = [];
      await this.loadAndRenderHome();
      this.toast("Videos shuffled ✨");

    async playVideo(id, updateUrl = true) {
      let v = this.videos.find(x => String(x.id) === String(id))
        || this.history.find(x => String(x.id) === String(id));

      if (!v || !v.embed) {
        this.showLoading("Loading video…");
        try {
          const data = await apiFetch({ ac: "detail", ids: String(id) });
          if (data.list && data.list[0]) {
            v = normalizeVideo(data.list[0]);
          }
        } catch (e) {
          console.error(e);
          this.toast("Could not load video");
          return;
        }
      }

      if (!v) {
        this.toast("Video not found");
        return;
      }

      if (!this.activeVideo) {
        this._savedScrollTop = window.scrollY || document.documentElement.scrollTop || 0;
      }
      this.activeVideo = v;
      this._playerRelated = [];

      // History
      this.history = this.history.filter(h => String(h.id) !== String(id));
      this.history.unshift({
        id: v.id,
        title: v.title,
        thumbnail: v.thumbnail || v.poster,
        duration: v.duration,
        category: v.category,
        timeAgo: "Just now",
        embed: v.embed
      });
      if (this.history.length > 50) this.history.pop();
      localStorage.setItem("p0rn_hist", JSON.stringify(this.history));

      if (updateUrl) {
        try {
          const newUrl = `${window.location.pathname}?v=${v.id}`;
          if (window.location.search !== `?v=${v.id}`) {
            history.pushState({ videoId: v.id }, v.title, newUrl);
          }
        } catch (_) {}
      }
      this.updateMetadata(v);

      this.renderPlayer(v);
      window.scrollTo({ top: 0, behavior: "smooth" });
      this.loadRelatedForPlayer(v);
    }

    async loadRelatedForPlayer(v) {
      try {
        let result;
        if (v.typeId) {
          result = await this.fetchVideos({ page: 1, typeId: v.typeId });
        } else if (v.category) {
          result = await this.fetchVideos({ page: 1, keyword: v.category });
        } else {
          // fallback: use words from title
          const words = (v.title || "").split(/[\s_\-]+/).filter(w => w.length > 3).slice(0, 2).join(" ");
          result = await this.fetchVideos({ page: 1, keyword: words || "hot" });
        }
        const related = (result.list || []).filter(x => x.id !== v.id).slice(0, 12);
        this._playerRelated = related;
        const box = document.getElementById("upNextList");
        if (!box) return;
        if (!related.length) {
          box.innerHTML = `<p style="color:var(--cream-dim);font-size:13px;">No related videos found.</p>`;
          return;
        }
        box.innerHTML = related.map(r => `
          <a href="?v=${r.id}" class="up-card" onclick="app.onCardClick(${r.id}, event)">
            <div class="up-thumb">
              ${r.thumbnail
                ? `<img src="${this.esc(r.thumbnail)}" alt="" loading="lazy" decoding="async" class="lq" onload="app.onImgProgress(this)" onerror="this.style.display='none'" />`
                : ""}
              <span class="badge-duration" style="font-size:9.5px;padding:2px 4px;">${this.esc(r.duration)}</span>
            </div>
            <div class="up-info">
              <div class="up-t">${this.esc(r.title)}</div>
              <div class="up-m">${this.esc(r.category)} • ${this.esc(r.duration)}</div>
            </div>
          </a>
        `).join("");
      } catch (e) {
        console.warn("related fail", e);
      }
    }

    /* THEMED EMBED URL BUILDER (Uses upstream player built-in minimal cinema theme & matching colors) */
    buildThemedEmbedUrl(embedUrl) {
      if (!embedUrl) return "";
      const currentTheme = "minimal"; // Built-in Minimal Cinema theme
      const currentColor = this.creamTheme ? "8B2E1A" : "F4D59A"; // Light mode honey-red vs Dark mode cream-gold
      try {
        const u = new URL(embedUrl, "https://upload18.net");
        u.searchParams.set("theme", currentTheme);
        u.searchParams.set("color", currentColor);
        return u.toString();
      } catch (_) {
        const sep = embedUrl.includes("?") ? "&" : "?";
        return `${embedUrl}${sep}theme=${currentTheme}&color=${currentColor}`;
      }
    }

    renderPlayer(v) {
      document.getElementById("categoryBar").style.display = "none";
      const main = document.getElementById("mainContainer");

      const related = (this._playerRelated || this.videos.filter(x => x.id !== v.id)).slice(0, 8);
      const backLabel = this.selectedCat
        ? `${this.selectedCat.name} Collection`
        : (this.tab === "category" ? "Collections" : "Feed");

      const themedEmbedUrl = this.buildThemedEmbedUrl(v.embed);

      const playerEmbedHtml = themedEmbedUrl
        ? `<iframe
              id="playerIframe"
              src="${this.esc(themedEmbedUrl)}"
              allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
              allowfullscreen
              referrerpolicy="origin"
              loading="eager"
              title="${this.esc(v.title)}"
            ></iframe>`
        : `<div class="player-fallback">
             <p>No playable link for this video.</p>
           </div>`;

      main.innerHTML = `
        <div class="player-wrap">
          <div class="player-top-bar">
            <button class="ctrl-btn player-back-btn" onclick="app.onPlayerBackClick()" title="Back">
              <span class="icon"><svg width="15" height="15" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></span>
              <span>Back to ${this.esc(backLabel)}</span>

          </div>

              <div class="watch-title-wrap">

                  <h1 class="watch-title single-line" id="watchTitle" title="${this.esc(v.title)}">${this.esc(v.title)}</h1>
                  <button class="watch-more-btn" id="watchMoreBtn" onclick="app.toggleWatchMore()" type="button" title="Show more details">...more</button>
                </div>
                <div class="watch-expanded-card" id="watchExpandedCard" style="display:none;">
                  <div class="expanded-full-title">${this.esc(v.title)}</div>
                  <div class="expanded-chips-row">
                    <span class="exp-chip">📁 ${this.esc(v.category)}</span>
                    <span class="exp-chip">⏱ ${this.esc(v.duration)}</span>
                    <span class="exp-chip">👁 ${this.esc(v.quality || v.views || "HD")}</span>
                    <span class="exp-chip">📅 ${this.esc(v.ago)}</span>
                  </div>
                  ${v.actors && v.actors.length ? `<div class="expanded-actors"><b>Cast:</b> ${this.esc(v.actors.join(", "))}</div>` : ""}
                  <button class="watch-less-btn" onclick="app.toggleWatchMore()" type="button">Show less ▴</button>
                </div>
              </div>

              <div class="watch-meta-row">
                <div class="watch-stats">
                  <span>${this.esc(v.quality || v.views || "HD")}</span>
                  <span> • </span>
                  <span>${this.esc(v.duration)}</span>
                  <span> • </span>
                  <span>${this.esc(v.ago)}</span>
                  <span> • </span>
                  <span>${this.esc(v.category)}</span>
                </div>

                <div class="player-actions">
                  <button class="action-pill ${this.isLiked(v.id) ? "liked" : ""}" id="likeBtn" onclick="app.toggleLike(${v.id})">
                    <span class="icon"><svg width="15" height="15" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></span>
                    <span class="like-label">${this.isLiked(v.id) ? "Liked" : "Like"}</span>
                  </button>

                  <button class="action-pill" onclick="app.toggleThemeFromPlayer()" title="Theme (5s lock)">
                    <span class="icon" id="playerThemeIcon">
                      ${this.creamTheme
                        ? '<svg width="15" height="15" viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1z"/></svg>'
                        : '<svg width="15" height="15" viewBox="0 0 24 24"><path d="M12 2L14.4 9.6L22 12L14.4 14.4L12 22L9.6 14.4L2 12L9.6 9.6L12 2Z"/></svg>'}
                    </span>
                    <span>Theme</span>
                  </button>
                  <button class="action-pill solid" onclick="app.shareVideo(${v.id})">
                    <span class="icon"><svg width="15" height="15" viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg></span>
                    <span>Share</span>
                  </button>
                </div>
              </div>
            </div>

            <div>
              <div class="up-next-title">Related for you</div>
              <div class="up-next-list" id="upNextList">
                ${related.length
                  ? related.map(r => `
                    <a href="?v=${r.id}" class="up-card" onclick="app.onCardClick(${r.id}, event)">
                      <div class="up-thumb">
                        ${r.thumbnail
                          ? `<img src="${this.esc(r.thumbnail)}" alt="" loading="lazy" decoding="async" class="lq" onload="app.onImgProgress(this)" onerror="this.style.display='none'" />`
                          : ""}
                        <span class="badge-duration" style="font-size:9.5px;padding:2px 4px;">${this.esc(r.duration)}</span>
                      </div>
                      <div class="up-info">
                        <div class="up-t">${this.esc(r.title)}</div>
                        <div class="up-m">${this.esc(r.category)} • ${this.esc(r.duration)}</div>
                      </div>
                    </a>
                  `).join("")
                  : `<p style="color:var(--cream-dim);font-size:13px;">No related videos loaded.</p>`}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    stopPlayerRuntime() {
      // Safe no-op stub for runtime cleanups
    }

    shareVideo(id) {
      const v = this.videos.find(x => String(x.id) === String(id))
        || this.history.find(x => String(x.id) === String(id))
        || this.activeVideo;
      const targetId = v ? v.id : id;
      const defaultDomain = "https://p0rn.online";
      const origin = (window.location.origin && window.location.origin !== "null" && !window.location.origin.includes("localhost"))
        ? window.location.origin
        : defaultDomain;
      const url = targetId
        ? `${origin}/?v=${targetId}`
        : `${origin}/`;
      const title = v ? `${v.title} - p0rn` : "p0rn - Watch Quality Videos";

      if (navigator.share) {
        navigator.share({
          title: title,
          text: title,
          url: url
        }).catch(() => {});
      } else if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url)
          .then(() => this.toast("Video link copied to clipboard!"))
          .catch(() => this.toast("URL: " + url));
      } else {
        this.toast("URL: " + url);
      }
    }

    closePlayer(updateUrl = true) {
      this.stopPlayerRuntime();
      if (this._keyHandler) {
        window.removeEventListener("keydown", this._keyHandler);
        this._keyHandler = null;
      }
      this.activeVideo = null;

      if (updateUrl) {
        try {
          const cleanUrl = this.selectedCat
            ? `${window.location.pathname}?collection=${this.selectedCat.id}`
            : window.location.pathname;
          if (window.location.search) {
            history.pushState({ page: this.selectedCat ? "collection" : "home" }, "p0rn - Watch Quality Videos", cleanUrl);
          }
        } catch (_) {}
      }
      this.restoreDefaultMetadata();

      if (this.selectedCat) {
        this.renderCategoryHub(this.selectedCat);
      } else {
        this.tab = "home";
        this.renderNav();
        this.renderCategoryBar();
        if (this.videos && this.videos.length) {
          this.renderHome();
        } else {
          this.loadAndRenderHome();
        }
      }

      // Smoothly restore previous scroll position so user never loses their place
      const targetScroll = this._savedScrollTop || 0;
      requestAnimationFrame(() => {
        window.scrollTo({ top: targetScroll, behavior: targetScroll > 0 ? "instant" : "smooth" });
      });
    }

    onPlayerBackClick() {
      if (window.history.length > 1 && window.location.search.includes("v=")) {
        window.history.back();
      } else {
        this.closePlayer(true);
      }
    }

    toggleWatchMore() {
      const card = document.getElementById("watchExpandedCard");
      const moreBtn = document.getElementById("watchMoreBtn");
      const title = document.getElementById("watchTitle");
      if (!card) return;
      const isHidden = card.style.display === "none";
      card.style.display = isHidden ? "block" : "none";
      if (moreBtn) {
        moreBtn.style.display = isHidden ? "none" : "inline-block";
      }
      if (title) {
        title.classList.toggle("single-line", !isHidden);
      }
    }

    /* SEO & METADATA ENGINE (Open Graph, Twitter, Schema.org Logo & Video) */
    secondsToIsoDuration(val) {
      if (!val || val === "—") return "PT15M";
      if (typeof val === "number") {
        const h = Math.floor(val / 3600);
        const m = Math.floor((val % 3600) / 60);
        const s = Math.floor(val % 60);
        let iso = "PT";
        if (h) iso += h + "H";
        if (m || h) iso += m + "M";
        iso += s + "S";
        return iso;
      }
      const str = String(val).trim();
      const parts = str.split(":").map(Number);
      if (parts.length === 3 && parts.every(n => !isNaN(n))) {
        return `PT${parts[0]}H${parts[1]}M${parts[2]}S`;
      }
      if (parts.length === 2 && parts.every(n => !isNaN(n))) {
        return `PT${parts[0]}M${parts[1]}S`;
      }
      const digits = parseInt(str.replace(/\D/g, ""), 10);
      if (!isNaN(digits) && digits > 0) {
        return `PT${digits}M`;
      }
      return "PT15M";
    }

    restoreDefaultMetadata() {
      const defaultDomain = "https://p0rn.online";
      const origin = (window.location.origin && window.location.origin !== "null" && !window.location.origin.includes("localhost"))
        ? window.location.origin
        : defaultDomain;
      const logoUrl = `${origin}/logo.png`;
      const defaultTitle = "p0rn - Watch Quality Videos";
      const defaultDesc = "Watch high quality HD streaming videos on p0rn.";
      const pageUrl = `${origin}/`;

      document.title = defaultTitle;
      const setAttr = (id, attr, val) => {
        const el = document.getElementById(id);
        if (el) el.setAttribute(attr, val);
      };
      setAttr("canonicalUrl", "href", pageUrl);
      setAttr("metaDescription", "content", defaultDesc);
      setAttr("ogType", "content", "website");
      setAttr("ogTitle", "content", defaultTitle);
      setAttr("ogDesc", "content", defaultDesc);
      setAttr("ogImage", "content", logoUrl);
      setAttr("ogImageSecure", "content", logoUrl);
      setAttr("ogUrl", "content", pageUrl);
      setAttr("twTitle", "content", defaultTitle);
      setAttr("twDesc", "content", defaultDesc);
      setAttr("twImage", "content", logoUrl);

      const schemaEl = document.getElementById("schemaStructuredData");
      if (schemaEl) {
        const data = {
          "@context": "https://schema.org",
          "@graph": [
            {
              "@type": "Organization",
              "@id": `${origin}/#organization`,
              "name": "p0rn",
              "url": `${origin}/`,
              "logo": {
                "@type": "ImageObject",
                "url": logoUrl,
                "width": 1671,
                "height": 941,
                "caption": "p0rn Logo"
              },
              "image": logoUrl
            },
            {
              "@type": "WebSite",
              "@id": `${origin}/#website`,
              "url": `${origin}/`,
              "name": "p0rn",
              "description": defaultDesc,
              "publisher": {
                "@id": `${origin}/#organization`
              }
            }
          ]
        };
        schemaEl.textContent = JSON.stringify(data, null, 2);
      }
    }

    updateMetadata(v) {
      if (!v) return;
      const defaultDomain = "https://p0rn.online";
      const origin = (window.location.origin && window.location.origin !== "null" && !window.location.origin.includes("localhost"))
        ? window.location.origin
        : defaultDomain;
      const logoUrl = `${origin}/logo.png`;
      const thumbUrl = v.thumbnail || v.poster || logoUrl;
      const videoUrl = `${origin}/?v=${v.id}`;
      const title = `${v.title} - p0rn`;
      const desc = `Watch ${v.title} in HD on p0rn. Duration: ${v.duration || 'Full length'}. ${v.category ? 'Category: ' + v.category + '.' : ''}`;

      document.title = title;
      const setAttr = (id, attr, val) => {
        const el = document.getElementById(id);
        if (el) el.setAttribute(attr, val);
      };
      setAttr("canonicalUrl", "href", videoUrl);
      setAttr("metaDescription", "content", desc);
      setAttr("ogType", "content", "video.other");
      setAttr("ogTitle", "content", title);
      setAttr("ogDesc", "content", desc);
      setAttr("ogImage", "content", thumbUrl);
      setAttr("ogImageSecure", "content", thumbUrl);
      setAttr("ogUrl", "content", videoUrl);
      setAttr("twTitle", "content", title);
      setAttr("twDesc", "content", desc);
      setAttr("twImage", "content", thumbUrl);

      const schemaEl = document.getElementById("schemaStructuredData");
      if (schemaEl) {
        const data = {
          "@context": "https://schema.org",
          "@graph": [
            {
              "@type": "Organization",
              "@id": `${origin}/#organization`,
              "name": "p0rn",
              "url": `${origin}/`,
              "logo": {
                "@type": "ImageObject",
                "url": logoUrl,
                "width": 1671,
                "height": 941,
                "caption": "p0rn Logo"
              },
              "image": logoUrl
            },
            {
              "@type": "VideoObject",
              "name": v.title,
              "description": desc,
              "thumbnailUrl": [thumbUrl],
              "uploadDate": new Date().toISOString(),
              "duration": this.secondsToIsoDuration(v.duration),
              "embedUrl": v.embed || "",
              "contentUrl": videoUrl,
              "publisher": {
                "@id": `${origin}/#organization`
              }
            }
          ]
        };
        schemaEl.textContent = JSON.stringify(data, null, 2);
      }
    }

    esc(str) {
      if (str == null) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
  }

  let app;
  document.addEventListener("DOMContentLoaded", () => {
    app = new P0rnApp();
    window.app = app;
  });
  </script>
