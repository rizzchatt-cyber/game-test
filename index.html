<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover, user-scalable=yes" />
  <title>p0rn</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="apple-touch-icon" href="logo.png" />
  <meta name="theme-color" content="#1A1210" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />

  <style>
    :root {
      /* Ember Night — dark warm base so thumbs pop; tomato & honey accents */
      --bg: #1A1210;
      --bg-header: #1A1210;
      --bg-card: #2A1F1C;
      --bg-card-hover: #352824;
      --bg-card-inner: #3D2E28;
      --bg-subtle: #241A17;
      --cream: #F4D59A;
      --cream-light: #f9e6bc;
      --cream-dim: rgba(244, 213, 154, 0.78);
      --cream-sub: rgba(244, 213, 154, 0.55);
      --accent: #E04A2F;
      --accent-soft: #C93D21;
      --border: rgba(244, 213, 154, 0.14);
      --border-focus: #F4D59A;
      --shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
      --radius-sm: 8px;
      --radius: 14px;
      --radius-lg: 18px;
      --pill: 9999px;
      --header-h: 64px;
      --bottom-h: 58px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --font: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-display: "Cormorant Garamond", Georgia, "Times New Roman", serif;
      --paper-opacity: 0.08;
    }

    body.cream-theme {
      /* Honey Butter — warm light */
      --bg: #F4D59A;
      --bg-header: #F4D59A;
      --bg-card: #f8e4b5;
      --bg-card-hover: #f0d9a0;
      --bg-card-inner: #e8cd8e;
      --bg-subtle: #e5c888;
      --cream: #8B2E1A;
      --cream-light: #C93D21;
      --cream-dim: rgba(139, 46, 26, 0.78);
      --cream-sub: rgba(139, 46, 26, 0.55);
      --accent: #C93D21;
      --accent-soft: #E04A2F;
      --border: rgba(139, 46, 26, 0.18);
      --border-focus: #C93D21;
      --shadow: 0 6px 22px rgba(139, 46, 26, 0.14);
      --paper-opacity: 0.09;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      font-size: 14px;
      scroll-behavior: smooth;
      background: var(--bg);
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--cream);
      min-height: 100dvh;
      line-height: 1.45;
      overflow-x: hidden;
      touch-action: manipulation;
      transition: background-color 0.3s ease, color 0.3s ease;
      position: relative;
    }
    /* Paper-like grain texture overlay */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9998;
      opacity: var(--paper-opacity);
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-repeat: repeat;
      background-size: 180px 180px;
      mix-blend-mode: overlay;
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9997;
      opacity: 0.06;
      background:
        radial-gradient(ellipse at 20% 30%, rgba(255,255,255,0.25) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 70%, rgba(0,0,0,0.12) 0%, transparent 45%);
    }

    header, nav, .bottom-nav, .bg-card, .video-card, .cat-card, .account-hub-container, input {
      transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: rgba(244, 213, 154, 0.4); border-radius: 6px; }

    .icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      vertical-align: middle;
    }
    .icon svg {
      display: block;
      fill: currentColor;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 200;
      height: var(--header-h);
      padding: 0 20px;
      background: var(--bg-header);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      cursor: pointer;
      user-select: none;
      flex-shrink: 0;
    }
    .brand-logo-img {
      height: 40px;
      width: auto;
      max-width: 130px;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.18));
      transition: transform 0.2s ease;
    }
    .brand-wrap:hover .brand-logo-img {
      transform: scale(1.04);
    }

    .desktop-nav {
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--bg-card);
      padding: 3px 5px;
      border-radius: var(--pill);
      border: 1px solid var(--border);
    }
    .nav-tab {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 36px;
      padding: 0 16px;
      border: none;
      border-radius: var(--pill);
      background: transparent;
      color: var(--cream);
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.16s ease;
      font-family: inherit;
    }
    .nav-tab:hover {
      background: rgba(252, 236, 200, 0.12);
    }
    .nav-tab.active {
      background: var(--cream);
      color: var(--bg);
      box-shadow: 0 2px 12px rgba(224, 74, 47, 0.35);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .header-search {
      width: 220px;
      height: 38px;
      display: flex;
      align-items: center;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--pill);
      padding: 0 12px;
      transition: width 0.22s ease, border-color 0.2s ease;
    }
    .header-search:focus-within {
      width: 280px;
      border-color: var(--border-focus);
      background: var(--bg-card-hover);
    }
    .header-search .icon {
      color: var(--cream-sub);
    }
    .header-search input {
      border: none;
      outline: none;
      background: transparent;
      color: var(--cream);
      font-size: 13px;
      font-weight: 500;
      width: 100%;
      margin: 0 6px;
      font-family: inherit;
    }
    .header-search input::placeholder {
      color: var(--cream-sub);
    }
    .clear-btn {
      background: transparent;
      border: none;
      color: var(--cream-sub);
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 2px;
    }
    .clear-btn:hover {
      color: var(--cream);
    }

    .theme-circle-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--cream);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .theme-circle-btn:hover {
      background: var(--bg-card-hover);
      transform: scale(1.06);
    }
    .theme-circle-btn:active {
      transform: scale(0.95);
    }
    .theme-circle-btn.spin-anim .icon {
      animation: themeSpin 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes themeSpin {
      0% { transform: scale(0.6) rotate(0deg); opacity: 0.4; }
      50% { transform: scale(1.25) rotate(200deg); opacity: 1; }
      100% { transform: scale(1) rotate(360deg); opacity: 1; }
    }

    .shuffle-btn.spin-anim .icon {
      animation: shuffleSpin 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes shuffleSpin {
      0% { transform: rotate(0deg) scale(0.9); }
      50% { transform: rotate(180deg) scale(1.2); }
      100% { transform: rotate(360deg) scale(1); }
    }

    .category-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      position: sticky;
      top: var(--header-h);
      z-index: 180;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }
    .category-bar::-webkit-scrollbar { display: none; }
    .cat-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 15px;
      border-radius: var(--pill);
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--cream);
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      flex-shrink: 0;
      user-select: none;
    }
    .cat-pill:hover {
      background: var(--bg-card-hover);
    }
    .cat-pill.active {
      background: var(--cream);
      color: var(--bg);
      border-color: var(--cream);
      box-shadow: 0 2px 10px rgba(224, 74, 47, 0.3);
    }

    .main-wrap {
      max-width: 1360px;
      margin: 0 auto;
      padding: 20px 16px calc(var(--bottom-h) + var(--safe-bottom) + 20px);
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .section-title {
      font-size: 20px;
      font-weight: 800;
      color: var(--cream);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-count {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--cream-dim);
    }

    .ctrl-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 16px;
      border-radius: var(--pill);
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--cream);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      font-family: inherit;
    }
    .ctrl-btn:hover { background: var(--bg-card-hover); }
    .ctrl-btn.solid {
      background: var(--cream);
      color: var(--bg);
      border-color: var(--cream);
    }
    .ctrl-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .videos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(285px, 1fr));
      gap: 20px 16px;
    }
    .video-card {
      display: flex;
      flex-direction: column;
      cursor: pointer;
      border-radius: var(--radius);
      transition: transform 0.18s ease;
    }
    .video-card:hover {
      transform: translateY(-5px);
    }
    .video-card:hover .thumb-wrap {
      box-shadow: 0 12px 32px rgba(0,0,0,0.5), 0 0 0 1px rgba(244, 213, 154, 0.12);
    }
    body.cream-theme .video-card:hover .thumb-wrap {
      box-shadow: 0 12px 28px rgba(139, 46, 26, 0.2), 0 0 0 1px rgba(201, 61, 33, 0.15);
    }
    .video-card:active {
      transform: scale(0.98);
    }

    .thumb-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--bg-subtle);
      box-shadow: var(--shadow);
    }
    .thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }
    .video-card:hover .thumb-wrap img {
      transform: scale(1.04);
    }

    .badge-duration {
      position: absolute;
      bottom: 6px;
      right: 6px;
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
    }
    .badge-cat {
      position: absolute;
      top: 6px;
      left: 6px;
      background: var(--accent);
      color: #F4D59A;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: var(--pill);
      text-transform: uppercase;
      box-shadow: 0 2px 8px rgba(0,0,0,0.35);
    }
    body.cream-theme .badge-cat {
      background: var(--accent);
      color: #F4D59A;
    }
    .badge-quality {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(0,0,0,0.75);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .card-info {
      margin-top: 8px;
    }
    .card-title {
      font-size: 14.5px;
      font-weight: 700;
      line-height: 1.35;
      color: var(--cream);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-meta {
      font-size: 12px;
      color: var(--cream-dim);
      margin-top: 3px;
    }

    .categories-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 24px 18px;
    }
    .cat-card {
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease;
      padding-top: 8px;
    }
    .cat-card:hover { transform: translateY(-4px); }
    .cat-card:active { transform: scale(0.98); }

    .cat-stack {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
    }
    .cat-stack-back {
      position: absolute;
      top: -6px;
      left: 6%;
      width: 88%;
      height: 100%;
      background: var(--bg-card-inner);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      opacity: 0.6;
    }
    .cat-stack-front {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--bg-subtle);
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cat-stack-front img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }
    .cat-card:hover .cat-stack-front img {
      transform: scale(1.04);
    }
    .cat-placeholder {
      font-size: 28px;
      font-weight: 900;
      color: var(--cream);
      opacity: 0.7;
      letter-spacing: 1px;
    }

    .cat-overlay {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 42%;
      background: linear-gradient(to right, transparent, rgba(26, 18, 16, 0.92));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: #F4D59A;
      padding: 8px;
      text-align: center;
    }
    body.cream-theme .cat-overlay {
      background: linear-gradient(to right, transparent, rgba(139, 46, 26, 0.9));
      color: #F4D59A;
    }
    .cat-overlay-count {
      font-size: 13.5px;
      font-weight: 800;
    }
    .cat-overlay-label {
      font-size: 9.5px;
      text-transform: uppercase;
      opacity: 0.85;
      font-weight: 700;
    }

    .cat-info-row {
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .cat-icon-bubble {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--cream);
      color: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-weight: 900;
      font-size: 14px;
    }
    .cat-name {
      font-size: 15.5px;
      font-weight: 800;
      color: var(--cream);
    }
    .cat-count-sub {
      font-size: 12px;
      color: var(--cream-dim);
    }

    .cat-hub-header {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      box-shadow: var(--shadow);
    }
    .cat-hub-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .cat-hub-thumb {
      width: 120px;
      aspect-ratio: 16/9;
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
      background: var(--bg-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cat-hub-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .cat-hub-text h2 {
      font-size: 19px;
      font-weight: 800;
      color: var(--cream);
    }
    .cat-hub-text p {
      font-size: 12.5px;
      color: var(--cream-dim);
      margin-top: 2px;
    }

    .player-wrap {
      max-width: 1200px;
      margin: 0 auto;
    }
    .player-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .player-layout {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 20px;
    }
    .video-screen-box {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: var(--radius);
      overflow: hidden;
      background: #000;
      box-shadow: var(--shadow);
    }
    .video-screen-box iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .video-screen-box .player-fallback {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #fff;
      background: #111;
      padding: 20px;
      text-align: center;
    }
    .video-screen-box .player-fallback a {
      color: var(--cream);
      font-weight: 700;
      text-decoration: underline;
    }

    .watch-title {
      font-size: 18px;
      font-weight: 800;
      line-height: 1.35;
      color: var(--cream);
      margin-top: 14px;
    }
    .watch-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 8px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .watch-stats {
      font-size: 12.5px;
      color: var(--cream-dim);
    }

    .share-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 18px;
      border-radius: var(--pill);
      background: var(--cream);
      color: var(--bg);
      border: none;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      font-family: inherit;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .share-btn:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }
    .share-btn:active {
      transform: scale(0.97);
    }

    .up-next-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--cream);
      margin-bottom: 10px;
    }
    .up-next-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .up-card {
      display: flex;
      gap: 10px;
      cursor: pointer;
      border-radius: 8px;
      padding: 4px;
      transition: background 0.15s;
    }
    .up-card:hover { background: var(--bg-card-hover); }
    .up-thumb {
      width: 110px;
      aspect-ratio: 16/9;
      border-radius: 6px;
      overflow: hidden;
      flex-shrink: 0;
      background: var(--bg-subtle);
      position: relative;
    }
    .up-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .up-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .up-t {
      font-size: 12.5px;
      font-weight: 700;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      color: var(--cream);
    }
    .up-m {
      font-size: 11px;
      color: var(--cream-dim);
      margin-top: 2px;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .hist-card {
      display: flex;
      gap: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);

  function normalizeVideo(raw) {
    const cat = Array.isArray(raw.category) && raw.category.length
      ? raw.category[0]
      : (raw.type_name || "Video");
    let embed = "";
    try {
      const ep = raw.episodes && raw.episodes.server_data;

        if (keys.length) embed = ep[keys[0]].link_embed || "";

    const thumb = raw.thumb_url || raw.poster_url || "";
    const poster = raw.poster_url || raw.thumb_url || "";
    return {
      id: raw.id,
      title: (raw.name || raw.source_vod_name || "Untitled").replace(/&amp;/g, "&").replace(/&bull;/g, "•"),

      year: raw.year || "",

  function formatAgo(dateStr) {
    if (!dateStr) return "Recently";
    try {
      const d = new Date(dateStr.replace(" ", "T"));
      if (isNaN(d.getTime())) return dateStr.slice(0, 10);
      const diff = Date.now() - d.getTime();
      const mins = Math.floor(diff / 60000);
      if (mins < 60) return mins <= 1 ? "Just now" : mins + " min ago";
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return hrs + " hour" + (hrs > 1 ? "s" : "") + " ago";
      const days = Math.floor(hrs / 24);
      if (days < 30) return days + " day" + (days > 1 ? "s" : "") + " ago";
      return dateStr.slice(0, 10);
    } catch {
      return dateStr.slice(0, 10);

    async fetchVideos({ page = 1, typeId = null, keyword = null } = {}) {
      const params = { ac: "detail", pg: String(page), pagesize: String(PAGE_SIZE) };
      if (typeId && typeId !== "all") params.t = String(typeId);
      if (keyword) params.wd = keyword;
      const data = await apiFetch(params);
      let list = (data.list || []).map(normalizeVideo).filter(v => v.id);
      // safety cap if upstream ignores pagesize
      if (list.length > PAGE_SIZE) list = list.slice(0, PAGE_SIZE);
      const pagecount = Number(data.pagecount) || 1;
      return {
        list,
        page: Number(data.page) || page,
        pagecount,
        total: Number(data.total) || list.length
      };
    }

    isLiked(id) {

      const v = this.activeVideo || this.videos.find(x => x.id === id);
      if (!v) return;
      if (this.isLiked(id)) {
        this.likes = this.likes.filter(x => x.id !== id);
        this.toast("Removed from likes");
      } else {
        this.likes.unshift({
          id: v.id,
          title: v.title,
          thumbnail: v.thumbnail || v.poster,
          duration: v.duration,
          category: v.category
        });
        if (this.likes.length > 100) this.likes.pop();
        this.toast("Liked ❤️");
      }
      localStorage.setItem("p0rn_likes", JSON.stringify(this.likes));
      const btn = document.getElementById("likeBtn");
      if (btn) {

        btn.classList.toggle("liked", on);

    renderCategoryBar() {
      const bar = document.getElementById("categoryBar");
      if (this.tab !== "home" || this.activeVideo || this.selectedCat) {
        bar.style.display = "none";
        return;
      }
      bar.style.display = "flex";

      // Top: Desi / Bhabhi style keyword pills (search API)
      const hotKeywords = [
        { label: "Desi Bhabhi", kw: "desi bhabhi" },
        { label: "Bhabhi", kw: "bhabhi" },
        { label: "Desi", kw: "desi" },
        { label: "Aunty", kw: "aunty" },
        { label: "Indian Hot", kw: "indian hot" },
        { label: "Mallu", kw: "mallu" },
        { label: "Hindi", kw: "hindi" }
      ];

      // Then viral API categories
      const popular = [
        "Indian", "Amateur", "Teen", "MILF", "Latina", "Asian Woman", "Japanese",
        "Lesbian", "Anal", "Big Tits", "Exotic", "Interracial", "Pornstar",
        "Real Amateur", "Blowjob", "Creampie", "Gangbang", "Virtual Reality", "AI", "Cam Porn"
      ];
      const barCats = [];
      const seen = new Set();
      popular.forEach(name => {
        const c = this.categories.find(x => x.name === name);
        if (c && !seen.has(c.id)) { barCats.push(c); seen.add(c.id); }
      });
      // More categories further down the bar
      this.categories.forEach(c => {
        if (barCats.length >= 28) return;
        if (!seen.has(c.id)) { barCats.push(c); seen.add(c.id); }
      });

      let html = `<div class="cat-pill ${this.activeCat === "all" && !this.query ? "active" : ""}" onclick="app.filterCategory('all')">
        <span>All</span>
      </div>`;

      hotKeywords.forEach(h => {
        const key = "kw:" + h.kw;
        const active = this.activeCat === key || (this.query && this.query.toLowerCase() === h.kw);
        html += `<div class="cat-pill ${active ? "active" : ""}" onclick="app.filterKeyword('${this.esc(h.kw)}')">
          <span>${this.esc(h.label)}</span>
        </div>`;
      });

      barCats.forEach(c => {
        html += `<div class="cat-pill ${this.activeCat === String(c.id) ? "active" : ""}" onclick="app.filterCategory('${c.id}')">
          <span>${this.esc(c.name)}</span>
        </div>`;
      });
      bar.innerHTML = html;

      this.page = 1;
      this.videos = [];
      this.renderCategoryBar();
      await this.loadAndRenderHome();
    }

    async filterKeyword(kw) {
      this.activeCat = "kw:" + kw;
      this.query = kw;
      document.getElementById("searchInput").value = kw;
      document.getElementById("clearBtn").style.display = "flex";
      this.page = 1;
      this.videos = [];
      if (this.tab !== "home") {
        this.tab = "home";
        this.renderNav();

      this.renderCategoryBar();
      await this.loadAndRenderHome();

    navigate(tab) {
      this.tab = tab;
      this.activeVideo = null;
      this.selectedCat = null;
      this.renderNav();
      this.renderCategoryBar();
      window.scrollTo({ top: 0, behavior: "smooth" });

      if (tab === "home") this.loadAndRenderHome();
      else if (tab === "category") {
        this.renderCategories(false);
      }
      else if (tab === "history") this.renderHistory();
      else if (tab === "account") this.renderAccount();

    bindSearch() {
      const input = document.getElementById("searchInput");
      const clear = document.getElementById("clearBtn");

      input.addEventListener("input", e => {
        this.query = e.target.value.trim();
        clear.style.display = this.query ? "flex" : "none";
        clearTimeout(this.searchTimer);
        this.searchTimer = setTimeout(() => {
          if (this.tab !== "home") {
            this.tab = "home";
            this.renderNav();
          }
          this.page = 1;
          this.videos = [];
          this.renderCategoryBar();
          this.loadAndRenderHome();
        }, 420);
      });

      input.addEventListener("keydown", e => {
        if (e.key === "Enter") {
          clearTimeout(this.searchTimer);
          this.page = 1;
          this.videos = [];
          this.loadAndRenderHome();
        }
      });
    }

    clearSearch() {
      this.query = "";
      this.activeCat = "all";
      document.getElementById("searchInput").value = "";
      document.getElementById("clearBtn").style.display = "none";
      this.page = 1;
      this.videos = [];
      this.renderCategoryBar();
      this.loadAndRenderHome();
    }

    toast(msg) {
      const box = document.getElementById("toastBox");
      const el = document.createElement("div");
      el.className = "toast-box";
      el.textContent = msg;
      box.appendChild(el);
      setTimeout(() => {
        el.style.opacity = "0";
        setTimeout(() => el.remove(), 250);
      }, 2200);

    showLoading(msg = "Loading…") {
      document.getElementById("mainContainer").innerHTML = `
        <div class="loading-box">
          <div class="spinner"></div>
          <p>${this.esc(msg)}</p>
        </div>`;

      document.getElementById("mainContainer").innerHTML = `
        <div class="empty-box">
          <h3>Something went wrong</h3>
          <p>${this.esc(msg)}</p>
          <button class="ctrl-btn solid" onclick="location.reload()">Retry</button>
        </div>`;
    }

    card(v, idx = 99) {
      const hi = v.thumbnail || v.poster || "";
      const lo = v.poster && v.thumbnail && v.poster !== v.thumbnail ? v.poster : "";
      let img = `<div class="cat-placeholder">▶</div>`;
      if (hi) {
        const src = lo || hi;
        const dataHi = lo ? hi : "";
        const eager = idx < 8;
        const prio = idx < 4 ? "high" : (eager ? "auto" : "low");
        img = `<img src="${this.esc(src)}" alt="${this.esc(v.title)}" loading="${eager ? "eager" : "lazy"}" decoding="async" fetchpriority="${prio}" class="lq" data-hi="${this.esc(dataHi)}" onload="app.onImgProgress(this)" onerror="this.style.display='none'" />`;
      }
      return `
        <div class="video-card" onclick="app.playVideo(${v.id})">
          <div class="thumb-wrap">
            ${img}
            <span class="badge-cat">${this.esc(v.category)}</span>
            ${v.quality ? `<span class="badge-quality">${this.esc(v.quality)}</span>` : ""}
            <span class="badge-duration">${this.esc(v.duration)}</span>
          </div>
          <div class="card-info">
            <h3 class="card-title">${this.esc(v.title)}</h3>
            <div class="card-meta">${this.esc(v.views)} • ${this.esc(v.ago)}</div>
          </div>
        </div>
      `;
    }

    onImgProgress(el) {
      if (!el) return;
      const hi = el.getAttribute("data-hi");
      if (hi && hi !== el.src && !el.dataset.upgraded) {
        el.dataset.upgraded = "1";
        const full = new Image();
        full.decoding = "async";
        full.onload = () => {
          el.src = hi;
          el.classList.remove("lq");
          el.classList.add("loaded");
        };
        full.onerror = () => {
          el.classList.remove("lq");
          el.classList.add("loaded");
        };
        full.src = hi;
      } else {
        requestAnimationFrame(() => {
          el.classList.remove("lq");
          el.classList.add("loaded");
        });
      }
    }

    async loadAndRenderHome(append = false) {
      if (this.loading) return;
      this.loading = true;

      if (!append) {
        this.showLoading(this.query ? "Searching…" : "Loading videos…");
      }

      try {
        let typeId = null;
        let keyword = this.query || null;
        if (this.activeCat && String(this.activeCat).startsWith("kw:")) {
          keyword = keyword || String(this.activeCat).slice(3);
          typeId = null;
        } else if (this.activeCat && this.activeCat !== "all") {
          typeId = this.activeCat;
        }

        let page = this.page;
        const result = await this.fetchVideos({
          page,
          typeId,
          keyword
        });

        if (append) {
          const ids = new Set(this.videos.map(v => v.id));
          result.list.forEach(v => {
            if (!ids.has(v.id)) this.videos.push(v);
          });
        } else {
          // Home All = latest/viral order from API (page 1 first)
          this.videos = result.list;
        }
        this.pagecount = result.pagecount;
        this.total = result.total;
        this.renderHome();
      } catch (e) {
        console.error(e);
        if (!append) this.showError("Could not load videos from API.");
        else this.toast("Failed to load more");
      } finally {
        this.loading = false;
      }
    }

    renderHome() {
      const main = document.getElementById("mainContainer");
      const list = this.videos;
      const title = (this.activeCat && String(this.activeCat).startsWith("kw:"))
        ? String(this.activeCat).slice(3).replace(/\b\w/g, c => c.toUpperCase())
        : (this.query
          ? "Search Results"
          : (this.activeCat === "all"
              ? "Mixed Feed"
              : (this.categories.find(c => String(c.id) === String(this.activeCat))?.name || "Category")));

      let html = `
        <div class="section-head">
          <h2 class="section-title">
            <span>${this.esc(title)}</span>
            <span class="section-count">(${this.total.toLocaleString()})</span>
          </h2>
          <div style="display:flex;gap:8px;align-items:center;">
            <button class="ctrl-btn shuffle-btn" id="shuffleBtn" onclick="app.shuffleFeed()" title="Refresh feed">
              <span class="icon">
                <svg width="15" height="15" viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
              </span>
              <span>Shuffle</span>
            </button>
            ${this.query ? `<button class="ctrl-btn" onclick="app.clearSearch()">Clear</button>` : ""}
          </div>
        </div>
      `;

      if (!list.length) {
        html += `
          <div class="empty-box">
            <h3>No videos found</h3>
            <p>Try another keyword or category.</p>
            <button class="ctrl-btn solid" onclick="app.clearSearch()">Reset</button>
          </div>
        `;
      } else {
        html += `<div class="videos-grid" id="videosGrid">${list.map((v,i) => this.card(v,i)).join("")}</div>`;
        if (this.page < this.pagecount) {
          html += `<div class="scroll-sentinel" id="scrollSentinel"></div>
            <div class="infinite-status" id="infiniteStatus"></div>`;
        }
      }

      main.innerHTML = html;
      this.bindInfiniteScroll();
      // silent preload next page into memory (no UI)
      if (this.page < this.pagecount && !this._preloading) {
        this._preloading = true;
        const next = this.page + 1;
        const typeId = (this.activeCat && this.activeCat !== "all" && !String(this.activeCat).startsWith("kw:")) ? this.activeCat : null;
        const keyword = this.query || (String(this.activeCat || "").startsWith("kw:") ? String(this.activeCat).slice(3) : null);
        this.fetchVideos({ page: next, typeId, keyword }).then(r => {
          this._prefetch = { page: next, list: r.list, pagecount: r.pagecount };
        }).catch(() => {}).finally(() => { this._preloading = false; });
      }
    }

    bindInfiniteScroll() {
      if (this._io) {
        this._io.disconnect();
        this._io = null;
      }
      const el = document.getElementById("scrollSentinel");
      if (!el) return;
      this._io = new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting) this.loadMoreSilent();
      }, { rootMargin: "400px 0px" });
      this._io.observe(el);
    }

    async loadMoreSilent() {
      if (this.loading || this.page >= this.pagecount) return;
      this.loading = true;
      const st = document.getElementById("infiniteStatus");
      if (st) st.textContent = "Loading…";
      this.page += 1;
      try {
        let typeId = null;
        let keyword = this.query || null;
        if (this.activeCat && String(this.activeCat).startsWith("kw:")) {
          keyword = keyword || String(this.activeCat).slice(3);
        } else if (this.activeCat && this.activeCat !== "all") {
          typeId = this.activeCat;
        }
        if (this.selectedCat) typeId = this.selectedCat.id;

        let result;
        if (this._prefetch && this._prefetch.page === this.page) {
          result = this._prefetch;
          this._prefetch = null;
        } else {
          result = await this.fetchVideos({ page: this.page, typeId, keyword });
        }
        const ids = new Set(this.videos.map(v => v.id));
        const fresh = (result.list || []).filter(v => !ids.has(v.id));
        this.videos.push(...fresh);
        this.pagecount = result.pagecount;

        const grid = document.getElementById("videosGrid");
        if (grid && fresh.length) {
          grid.insertAdjacentHTML("beforeend", fresh.map((v,i) => this.card(v, 99)).join(""));
        }
        if (this.page >= this.pagecount) {
          if (st) st.textContent = "";
          const sen = document.getElementById("scrollSentinel");
          if (sen) sen.remove();
          if (this._io) { this._io.disconnect(); this._io = null; }
        } else if (st) st.textContent = "";
      } catch (e) {
        console.error(e);
        if (st) st.textContent = "Could not load more";
        this.page -= 1;
      } finally {
        this.loading = false;
      }
    }

    async loadMore() {
      await this.loadMoreSilent();
    }

    async shuffleFeed() {
      const btn = document.getElementById("shuffleBtn");
      if (btn) {
        btn.classList.add("spin-anim");
        setTimeout(() => btn.classList.remove("spin-anim"), 460);
      }
      // Jump to a random page for variety
      const maxPage = Math.min(this.pagecount || 20, 40);
      this.page = Math.floor(Math.random() * maxPage) + 1;
      this.videos = [];
      await this.loadAndRenderHome();
      this.toast("Videos shuffled ✨");
    }

    /* CATEGORIES */
    renderCategories(skipFetch = false) {
      document.getElementById("categoryBar").style.display = "none";
      const main = document.getElementById("mainContainer");

      // Order: Indian / viral first, then the rest A–Z
      const priority = [
        "Indian", "Amateur", "Teen", "MILF", "Latina", "Asian Woman", "Japanese",
        "Lesbian", "Anal", "Big Tits", "Exotic", "Interracial", "Pornstar",
        "Real Amateur", "Blowjob", "Creampie", "Gangbang", "AI", "Arab", "BBW"
      ];
      const ordered = this.categories.slice().sort((a, b) => {
        const ia = priority.indexOf(a.name);
        const ib = priority.indexOf(b.name);
        const pa = ia === -1 ? 999 : ia;
        const pb = ib === -1 ? 999 : ib;
        if (pa !== pb) return pa - pb;
        return a.name.localeCompare(b.name);
      });

      let html = `
        <div class="section-head">
          <h2 class="section-title">Categories</h2>
          <span class="section-count">${this.categories.length} categories</span>
        </div>
        <div class="categories-grid">
      `;

      ordered.forEach(cat => {
        const initial = cat.name.charAt(0).toUpperCase();
        const thumbHtml = cat.thumb
          ? `<img src="${this.esc(cat.thumb)}" alt="${this.esc(cat.name)}" loading="lazy" decoding="async" class="lq" onload="app.onImgProgress(this)" onerror="this.style.display='none';this.nextElementSibling&&(this.nextElementSibling.style.display='flex')" />
             <div class="cat-placeholder" style="display:none">${this.esc(initial)}</div>`
          : `<div class="cat-placeholder">${this.esc(initial)}</div>`;

        html += `
          <div class="cat-card" data-cat-id="${cat.id}" onclick="app.openCategoryHub('${cat.id}')">
            <div class="cat-stack">
              <div class="cat-stack-back"></div>
              <div class="cat-stack-front">
                ${thumbHtml}
                <div class="cat-overlay">
                  <span class="cat-overlay-count">${this.esc(cat.name)}</span>
                  <span class="cat-overlay-label">open</span>
                </div>
              </div>
            </div>
            <div class="cat-info-row">
              <div>
                <h3 class="cat-name">${this.esc(cat.name)}</h3>
                <div class="cat-count-sub">Browse</div>
              </div>
            </div>
          </div>
        `;
      });

      html += `</div>`;
      main.innerHTML = html;

      if (!skipFetch) this.enrichAllCategoryMetas();
    }

    async openCategoryHub(typeId) {
      const cat = this.categories.find(c => String(c.id) === String(typeId));
      if (!cat) return;
      this.selectedCat = cat;
      this.page = 1;
      this.videos = [];
      document.getElementById("categoryBar").style.display = "none";
      this.showLoading(`Loading ${cat.name}…`);
      window.scrollTo({ top: 0, behavior: "smooth" });

      try {
        const result = await this.fetchVideos({ page: 1, typeId: cat.id });
        this.videos = result.list;
        this.pagecount = result.pagecount;
        this.total = result.total;
        cat.count = result.total;
        if (result.list[0]) {
          cat.thumb = result.list[0].thumbnail || result.list[0].poster || cat.thumb;
        }
        this.renderCategoryHub(cat);
      } catch (e) {
        console.error(e);
        this.showError("Failed to load category.");
      }
    }

    renderCategoryHub(cat) {
      const main = document.getElementById("mainContainer");
      const cover = this.videos[0]?.thumbnail || this.videos[0]?.poster || "";

      let html = `
        <div class="cat-hub-header">
          <div class="cat-hub-left">
            <div class="cat-hub-thumb">
              ${cover
                ? `<img src="${this.esc(cover)}" alt="" />`
                : `<div class="cat-placeholder">${this.esc(cat.name.charAt(0))}</div>`}
            </div>
            <div class="cat-hub-text">
              <h2>${this.esc(cat.name)}</h2>
              <p>Browse collection</p>
            </div>
          </div>
          <div style="display:flex;gap:8px;">
            ${this.videos.length
              ? `<button class="ctrl-btn solid" onclick="app.playVideo(${this.videos[0].id})">Play</button>`
              : ""}
            <button class="ctrl-btn" onclick="app.closeCategoryHub()">All Categories</button>
          </div>
        </div>
        <div class="section-head">
          <h3 class="section-title">Videos in ${this.esc(cat.name)}</h3>
        </div>
        <div class="videos-grid">
          ${this.videos.map((v,i) => this.card(v,i)).join("")}
        </div>
      `;

      if (this.page < this.pagecount) {
        html += `<div class="scroll-sentinel" id="scrollSentinel"></div>
          <div class="infinite-status" id="infiniteStatus"></div>`;
      }

      main.innerHTML = html;
      // mark grid for append
      const grid = main.querySelector(".videos-grid");
      if (grid) grid.id = "videosGrid";
      this.bindInfiniteScroll();
    }

    async loadMoreHub() {
      await this.loadMoreSilent();
    }

    closeCategoryHub() {
      this.selectedCat = null;
      this.renderCategories();
    }

    /* HISTORY */
    renderHistory() {
      document.getElementById("categoryBar").style.display = "none";
      const main = document.getElementById("mainContainer");
      const list = this.history;

      let html = `
        <div class="section-head">
          <h2 class="section-title">Watch History</h2>
          ${list.length ? `<button class="ctrl-btn" onclick="app.clearHistory()">Clear</button>` : ""}
        </div>
      `;

      if (!list.length) {
        html += `
          <div class="empty-box">
            <h3>No watch history yet</h3>
            <p>Videos you watch will be remembered locally.</p>
            <button class="ctrl-btn solid" onclick="app.navigate('home')">Browse Feed</button>
          </div>
        `;
      } else {
        html += `<div class="history-list">
          ${list.map(h => `
            <div class="hist-card" onclick="app.playVideo(${h.id})">
              <div class="hist-thumb">
                ${h.thumbnail
                  ? `<img src="${this.esc(h.thumbnail)}" alt="" onerror="this.style.display='none'" />`
                  : ""}
                <span class="badge-duration">${this.esc(h.duration || "—")}</span>
              </div>
              <div class="hist-info">
                <h3 class="hist-title">${this.esc(h.title)}</h3>
                <div class="hist-meta">${this.esc(h.category || "")} • Watched ${this.esc(h.timeAgo || "recently")}</div>
              </div>
            </div>
          `).join("")}
        </div>`;
      }

      main.innerHTML = html;
    }

    clearHistory() {
      this.history = [];
      localStorage.setItem("p0rn_hist", "[]");
      this.renderHistory();
      this.toast("History cleared");
    }

    /* ACCOUNT */
    renderAccount() {
      document.getElementById("categoryBar").style.display = "none";
      const main = document.getElementById("mainContainer");

      main.innerHTML = `
        <div class="account-hub-container">
          <div class="coming-soon-pill">COMING SOON</div>
          <div class="avatar-ring">
            <span class="icon">
              <svg width="28" height="28" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </span>
          </div>
          <h2 class="hub-title">Account & Profile Hub</h2>
          <p class="hub-desc">Accounts, personal playlists, watch-later and creator tools are on the way.<br>Everything you watch is already remembered locally. Powered by XVIDAPI.</p>
          <div class="features-grid">
            <div class="feature-card">
              <div class="feature-icon-box">
                <svg width="20" height="20" viewBox="0 0 24 24"><path d="M4 11h5V5H4v6zm0 7h5v-6H4v6zm6 0h5v-6h-5v6zm6 0h5v-6h-5v6zm-6-7h5V5h-5v6zm6-6v6h5V5h-5z"/></svg>
              </div>
              <div class="feature-text">
                <h4>Custom Playlists</h4>
                <p>Curate your own collections</p>
              </div>
            </div>
            <div class="feature-card">
              <div class="feature-icon-box">
                <svg width="20" height="20" viewBox="0 0 24 24"><path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
              </div>
              <div class="feature-text">
                <h4>Resume Watching</h4>
                <p>Pick up where you left off</p>
              </div>
            </div>
            <div class="feature-card">
              <div class="feature-icon-box">
                <svg width="20" height="20" viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>
              </div>
              <div class="feature-text">
                <h4>Likes & Saved</h4>
                <p>Keep your favourites handy</p>
              </div>
            </div>
            <div class="feature-card">
              <div class="feature-icon-box">
                <svg width="20" height="20" viewBox="0 0 24 24"><path d="M12 2L14.4 9.6L22 12L14.4 14.4L12 22L9.6 14.4L2 12L9.6 9.6L12 2Z"/></svg>
              </div>
              <div class="feature-text">
                <h4>Themes</h4>
                <p>Ember Night & Honey Butter</p>
              </div>
            </div>
          </div>
          <div style="display:flex;justify-content:center;">
            <div class="ads-toggle-row">
              <span class="ads-toggle-label">Pre-roll ads</span>
              <div class="switch-track ${this.adsEnabled ? "on" : ""}" onclick="app.toggleAds()">
                <div class="switch-thumb"></div>
              </div>
              <span class="switch-status-text">${this.adsEnabled ? "On" : "Off"}</span>
            </div>
          </div>
          <div class="hub-actions">
            <button class="ctrl-btn solid" onclick="app.navigate('home')">
              <span class="icon"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></span>
              <span>Explore</span>
            </button>
            <button class="ctrl-btn" onclick="app.toggleTheme()">
              <span class="icon"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M12 2L14.4 9.6L22 12L14.4 14.4L12 22L9.6 14.4L2 12L9.6 9.6L12 2Z"/></svg></span>
              <span id="themeBtnText">${this.creamTheme ? "Theme: Honey Butter" : "Theme: Ember Night"}</span>
            </button>
          </div>
        </div>
      `;
    }

    /* PLAYER */
    async playVideo(id) {
      let v = this.videos.find(x => x.id === id)
        || this.history.find(x => x.id === id);

      if (!v || !v.embed) {
        this.showLoading("Loading video…");
        try {
          const data = await apiFetch({ ac: "detail", ids: String(id) });
          if (data.list && data.list[0]) {
            v = normalizeVideo(data.list[0]);
          }
        } catch (e) {
          console.error(e);
          this.toast("Could not load video");
          return;
        }
      }

      if (!v) {
        this.toast("Video not found");
        return;
      }

      this.activeVideo = v;
      this._playerRelated = [];

      // History
      this.history = this.history.filter(h => h.id !== id);
      this.history.unshift({
        id: v.id,
        title: v.title,
        thumbnail: v.thumbnail || v.poster,
        duration: v.duration,
        category: v.category,
        timeAgo: "Just now",
        embed: v.embed
      });
      if (this.history.length > 50) this.history.pop();
      localStorage.setItem("p0rn_hist", JSON.stringify(this.history));

      this.renderPlayer(v);
      window.scrollTo({ top: 0, behavior: "smooth" });
      this.loadRelatedForPlayer(v);
    }

    async loadRelatedForPlayer(v) {
      try {
        let result;
        if (v.typeId) {
          result = await this.fetchVideos({ page: 1, typeId: v.typeId });
        } else if (v.category) {
          result = await this.fetchVideos({ page: 1, keyword: v.category });
        } else {
          // fallback: use words from title
          const words = (v.title || "").split(/[\s_\-]+/).filter(w => w.length > 3).slice(0, 2).join(" ");
          result = await this.fetchVideos({ page: 1, keyword: words || "hot" });
        }
        const related = (result.list || []).filter(x => x.id !== v.id).slice(0, 12);
        this._playerRelated = related;
        const box = document.getElementById("upNextList");
        if (!box) return;
        if (!related.length) {
          box.innerHTML = `<p style="color:var(--cream-dim);font-size:13px;">No related videos found.</p>`;
          return;
        }
        box.innerHTML = related.map(r => `
          <div class="up-card" onclick="app.playVideo(${r.id})">
            <div class="up-thumb">
              ${r.thumbnail
                ? `<img src="${this.esc(r.thumbnail)}" alt="" loading="lazy" decoding="async" class="lq" onload="app.onImgProgress(this)" onerror="this.style.display='none'" />`
                : ""}
              <span class="badge-duration" style="font-size:9.5px;padding:2px 4px;">${this.esc(r.duration)}</span>
            </div>
            <div class="up-info">
              <div class="up-t">${this.esc(r.title)}</div>
              <div class="up-m">${this.esc(r.category)} • ${this.esc(r.duration)}</div>
            </div>
          </div>
        `).join("");
      } catch (e) {
        console.warn("related fail", e);
      }
    }

    renderPlayer(v) {
      document.getElementById("categoryBar").style.display = "none";
      const main = document.getElementById("mainContainer");

      // Placeholder until related loads; show same-list as instant fallback
      const related = (this._playerRelated || this.videos.filter(x => x.id !== v.id)).slice(0, 8);
      const backLabel = this.selectedCat
        ? this.selectedCat.name
        : (this.tab === "category" ? "Category" : "Feed");

      const embedUrl = v.embed || "";
      /* Show exactly what API/embed gives. No skip-ad UI from us. */
      const playerHtml = embedUrl
        ? `<iframe
              src="${this.esc(embedUrl)}"
              allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
              allowfullscreen
              referrerpolicy="origin"
              loading="eager"
              title="${this.esc(v.title)}"
            ></iframe>`
        : `<div class="player-fallback">
             <p>No playable link for this video.</p>
           </div>`;

      main.innerHTML = `
        <div class="player-wrap">
          <div class="player-top-bar">
            <button class="ctrl-btn" onclick="app.closePlayer()">
              <span class="icon"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></span>
              <span>Back to ${this.esc(backLabel)}</span>
            </button>
          </div>

          <div class="player-layout">
            <div>
              <div class="video-screen-box">
                ${playerHtml}
              </div>

              <h1 class="watch-title">${this.esc(v.title)}</h1>

              <div class="watch-meta-row">
                <div class="watch-stats">
                  <span>${this.esc(v.quality || v.views || "HD")}</span>
                  <span> • </span>
                  <span>${this.esc(v.duration)}</span>
                  <span> • </span>
                  <span>${this.esc(v.ago)}</span>
                  <span> • </span>
                  <span>${this.esc(v.category)}</span>
                  ${v.actors && v.actors.length
                    ? ` • <span>${this.esc(v.actors.slice(0, 3).join(", "))}</span>`
                    : ""}
                </div>

                <div class="player-actions">
                  <button class="action-pill ${this.isLiked(v.id) ? "liked" : ""}" id="likeBtn" onclick="app.toggleLike(${v.id})">
                    <span class="icon"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></span>
                    <span class="like-label">${this.isLiked(v.id) ? "Liked" : "Like"}</span>
                  </button>
                  <div class="action-pill ads-pill">
                    <span class="ads-toggle-label">Ads</span>
                    <div class="switch-track ${this.adsEnabled ? "on" : ""}" onclick="app.toggleAdsFromPlayer()">
                      <div class="switch-thumb"></div>
                    </div>
                    <span class="switch-status-text" id="playerAdsStatus">${this.adsEnabled ? "On" : "Off"}</span>
                  </div>
                  <button class="action-pill" onclick="app.toggleThemeFromPlayer()" title="Theme (5s lock)">
                    <span class="icon" id="playerThemeIcon">
                      ${this.creamTheme
                        ? '<svg width="16" height="16" viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1z"/></svg>'
                        : '<svg width="16" height="16" viewBox="0 0 24 24"><path d="M12 2L14.4 9.6L22 12L14.4 14.4L12 22L9.6 14.4L2 12L9.6 9.6L12 2Z"/></svg>'}
                    </span>
                    <span>Theme</span>
                  </button>
                  <button class="action-pill solid" onclick="app.shareVideo(${v.id})">
                    <span class="icon"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg></span>
                    <span>Share</span>
                  </button>
                </div>
              </div>
            </div>

            <div>
              <div class="up-next-title">Related for you</div>
              <div class="up-next-list" id="upNextList">
                ${related.length
                  ? related.map(r => `
                    <div class="up-card" onclick="app.playVideo(${r.id})">
                      <div class="up-thumb">
                        ${r.thumbnail
                          ? `<img src="${this.esc(r.thumbnail)}" alt="" loading="lazy" decoding="async" class="lq" onload="app.onImgProgress(this)" onerror="this.style.display='none'" />`
                          : ""}
                        <span class="badge-duration" style="font-size:9.5px;padding:2px 4px;">${this.esc(r.duration)}</span>
                      </div>
                      <div class="up-info">
                        <div class="up-t">${this.esc(r.title)}</div>
                        <div class="up-m">${this.esc(r.category)} • ${this.esc(r.duration)}</div>
                      </div>
                    </div>
                  `).join("")
                  : `<p style="color:var(--cream-dim);font-size:13px;">No related videos loaded.</p>`}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    shareVideo(id) {
      const v = this.videos.find(x => x.id === id) || this.activeVideo;
      const url = window.location.href;
      if (navigator.share) {
        navigator.share({
          title: v ? v.title : "p0rn",
          url: url
        }).catch(() => {});
      } else if (navigator.clipboard) {
        navigator.clipboard.writeText(url);
        this.toast("Link copied to clipboard");
      } else {
        this.toast("URL: " + url);
      }
    }

    closePlayer() {
      this.activeVideo = null;
      if (this.selectedCat) {
        this.renderCategoryHub(this.selectedCat);
      } else {
        this.navigate(this.tab);
      }
    }

    esc(str) {
      if (str == null) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
  }

  let app;
  document.addEventListener("DOMContentLoaded", () => {
    app = new P0rnApp();
    window.app = app;
  });
  </script>
